<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="login" class="login-screen">
            <h1>Join Workspace</h1>
            <input id="username" placeholder="Enter Username">
            <input id="room" placeholder="Enter Room (e.g. #general)">
            <button onclick="connect()">Connect to Server</button>
        </div>

        <div id="app" class="chat-app">
            <div id="history-panel" class="history-panel">
                <div class="history-header">
                    Recent Chats
                </div>
                <div class="history-list" id="history-list">
                    <!-- History items will be added here -->
                </div>
            </div>

            <div class="main-chat">
                <div class="Header" id="room-header">
                    <button class="outline" onclick="toggleHistory()" style="width: auto; padding: 4px 8px; font-size: 0.8rem;">☰</button>
                    <span id="room-header-text">#general | 1 members online</span>
                </div>
                <div class="presence-list" id="presence"></div>
                
                <div class="chat-container">
                    <div id="chat"></div>
                    <div id="typing-indicator" style="display:none; color: var(--secondary); font-style: italic;"></div>
                </div>

                <div class="input-area">
                    <input id="msg" placeholder="Message..." oninput="sendTyping()" onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button onclick="sendMsg()" style="width: auto;">Send</button>
                </div>
            </div>

            <div id="dm-panel" class="dm-panel">
                <div class="dm-header">
                    <div class="Header">Private: <span id="dm-target"></span></div>
                    <button class="close-btn" onclick="closeDM()">✕</button>
                </div>
                <div class="separator">──────────────────</div>
                
                <div class="chat-container">
                    <div id="dm-chat"></div>
                    <div id="dm-typing-indicator" style="display:none; color: var(--secondary); font-style: italic;"></div>
                </div>

                <div class="input-area" style="padding: 10px;">
                    <input id="dm-msg" placeholder="Direct Message..." oninput="sendDMTyping()" onkeypress="if(event.key === 'Enter') sendDMMsg()">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
